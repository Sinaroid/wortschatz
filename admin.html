<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wortschatz Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f4f0;--bg2:#eaeae4;--bg3:#d8d8d0;
  --card:#fff;--ink:#0f0f0e;--ink2:#4a4a42;--ink3:#8a8a80;--ink4:#b8b8ae;
  --accent:#1a3af2;--abl:rgba(26,58,242,.09);
  --ok:#126e35;--okbg:rgba(18,110,53,.08);
  --err:#cc2020;--errbg:rgba(204,32,32,.07);
  --warn:#a84800;--warnbg:rgba(168,72,0,.07);
  --sans:'Vazirmatn',system-ui,sans-serif;
  --r2:10px;--r3:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;direction:rtl}
button,input,select{font-family:var(--sans)}

/* ── Login ── */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:20px;padding:40px 32px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--ink3);margin-bottom:28px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--bg3);border-radius:var(--r2);font-size:14px;background:var(--bg);color:var(--ink);outline:none;transition:border .2s;margin-bottom:12px}
.inp:focus{border-color:var(--accent)}
.btn{width:100%;padding:13px;border:none;border-radius:var(--r2);background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5}
#login-err{font-size:12px;color:var(--err);min-height:16px;margin-top:6px;text-align:center}

/* ── App ── */
#app{display:none}
#app.show{display:block}

.topbar{background:var(--card);border-bottom:1px solid var(--bg3);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-title span{font-size:20px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn-sm{padding:7px 14px;border:1.5px solid var(--bg3);border-radius:8px;background:var(--card);color:var(--ink2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.badge-pro{background:rgba(26,58,242,.12);color:var(--accent)}
.badge-beta{background:rgba(168,72,0,.1);color:var(--warn)}
.badge-free{background:var(--bg2);color:var(--ink3)}

.main{max-width:1200px;margin:0 auto;padding:24px 20px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--r2);padding:16px;border:1px solid var(--bg3)}
.stat-card .label{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.5px;margin-bottom:6px}
.stat-card .value{font-size:26px;font-weight:700;color:var(--ink)}
.stat-card .sub{font-size:11px;color:var(--ink3);margin-top:3px}
.stat-card.green .value{color:var(--ok)}
.stat-card.blue .value{color:var(--accent)}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--bg3);padding-bottom:0}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

/* ── Filters ── */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:5px 12px;font-size:12px;font-weight:600;border:1.5px solid var(--bg3);border-radius:20px;background:var(--card);color:var(--ink3);cursor:pointer;transition:all .15s}
.filter-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-inp{padding:7px 12px;border:1.5px solid var(--bg3);border-radius:8px;font-size:13px;background:var(--card);color:var(--ink);outline:none;min-width:200px}
.search-inp:focus{border-color:var(--accent)}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--r2);border:1px solid var(--bg3)}
table{width:100%;border-collapse:collapse;background:var(--card)}
thead{background:var(--bg2)}
th{padding:10px 14px;font-size:11px;font-weight:700;color:var(--ink3);text-align:right;letter-spacing:.5px;white-space:nowrap}
td{padding:10px 14px;font-size:13px;color:var(--ink);border-top:1px solid var(--bg2);vertical-align:middle}
tr:hover td{background:var(--bg)}
.email-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.plan-select{padding:4px 8px;border:1.5px solid var(--bg3);border-radius:6px;font-size:12px;font-weight:600;background:var(--card);cursor:pointer;outline:none}
.plan-select:focus{border-color:var(--accent)}
.act-btn{padding:4px 10px;font-size:11px;font-weight:700;border:none;border-radius:6px;cursor:pointer;transition:opacity .15s}
.act-btn:hover{opacity:.8}
.act-btn.save{background:var(--accent);color:#fff}
.act-btn.revoke{background:var(--errbg);color:var(--err)}

/* ── Analytics ── */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:640px){.analytics-grid{grid-template-columns:1fr}}
.a-card{background:var(--card);border:1px solid var(--bg3);border-radius:var(--r2);padding:16px}
.a-card h3{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--ink2)}
.a-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg2);font-size:12px}
.a-row:last-child{border:none}
.a-bar-wrap{flex:1;margin:0 10px;background:var(--bg2);border-radius:4px;height:6px;overflow:hidden}
.a-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}
#toast.ok{background:var(--ok)}
#toast.err{background:var(--err)}

/* ── Loading ── */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--ink3);font-size:14px}
.spin{width:20px;height:20px;border:2px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin-left:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Extend Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:20px;padding:28px;max-width:360px;width:100%}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px}
.modal label{font-size:12px;font-weight:600;color:var(--ink3);display:block;margin-bottom:4px}
.modal input{width:100%;padding:10px 12px;border:1.5px solid var(--bg3);border-radius:8px;font-size:14px;background:var(--bg);color:var(--ink);outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.modal-btns button{flex:1;padding:11px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn-cancel{background:var(--bg2);color:var(--ink2)}
.btn-save{background:var(--accent);color:#fff}

@media(max-width:640px){
  .main{padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:12px 16px}
  .filters{gap:6px}
}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-card">
    <h1>🔐 Wortschatz Admin</h1>
    <p>پنل مدیریت — ورود ادمین</p>
    <input class="inp" id="pwd-inp" type="password" placeholder="رمز ادمین" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">ورود</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title"><span>⚡</span> Wortschatz Admin</div>
    <div class="topbar-actions">
      <button class="btn-sm" onclick="loadAll()">🔄 رفرش</button>
      <button class="btn-sm" onclick="exportCSV()">📥 CSV</button>
      <button class="btn-sm" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="main">
    <!-- Stats -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card blue"><div class="label">کل کاربران</div><div class="value" id="st-total">—</div></div>
      <div class="stat-card green"><div class="label">Pro</div><div class="value" id="st-pro">—</div><div class="sub" id="st-mrr">MRR: —</div></div>
      <div class="stat-card"><div class="label">Beta</div><div class="value" id="st-beta">—</div></div>
      <div class="stat-card"><div class="label">Free</div><div class="value" id="st-free">—</div></div>
      <div class="stat-card green"><div class="label">ARR</div><div class="value" id="st-arr">—</div></div>
      <div class="stat-card"><div class="label">Conversion</div><div class="value" id="st-conv">—</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab on" onclick="switchTab('users',this)">👥 کاربران</button>
      <button class="tab" onclick="switchTab('analytics',this)">📊 آنالیتیک</button>
    </div>

    <!-- Users Tab -->
    <div id="tab-users">
      <div class="filters">
        <button class="filter-btn on" onclick="setFilter('all',this)">همه</button>
        <button class="filter-btn" onclick="setFilter('pro',this)">Pro</button>
        <button class="filter-btn" onclick="setFilter('beta',this)">Beta</button>
        <button class="filter-btn" onclick="setFilter('free',this)">Free</button>
        <input class="search-inp" id="search-inp" placeholder="جستجو ایمیل..." oninput="renderUsers()">
      </div>
      <div id="users-container">
        <div class="loading"><div class="spin"></div> در حال بارگذاری...</div>
      </div>
    </div>

    <!-- Analytics Tab -->
    <div id="tab-analytics" style="display:none">
      <div id="analytics-container">
        <div class="loading"><div class="spin"></div> در حال بارگذاری...</div>
      </div>
    </div>
  </div>
</div>

<!-- Extend Modal -->
<div class="modal-bg" id="extend-modal">
  <div class="modal">
    <h3>⏰ تمدید Pro</h3>
    <label>ایمیل</label>
    <input id="ext-email" readonly style="color:var(--ink3)">
    <label>روزهای اضافه</label>
    <input id="ext-days" type="number" value="30" min="1" max="365">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeExtend()">انصراف</button>
      <button class="btn-save" onclick="doExtend()">تمدید</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ekogfglcsftpwmithxbi.supabase.co';
const SB_KEY = 'sb_publishable_S6XmIDmzzUgsKZNeTw2bAA_A8mzZmta';
const sb = supabase.createClient(SB_URL, SB_KEY);

const ADMIN_PWD = 'ws_admin_2025';
let adminPwd = '';
let allUsers = [];
let currentFilter = 'all';
let extendUserId = '';

// ── Auth ──
function doLogin() {
  const pwd = document.getElementById('pwd-inp').value.trim();
  const errEl = document.getElementById('login-err');
  if (!pwd) { errEl.textContent = 'رمز را وارد کن'; return; }
  if (pwd !== ADMIN_PWD) { errEl.textContent = 'رمز اشتباهه'; return; }
  adminPwd = pwd;
  sessionStorage.setItem('ws_admin_ok', '1');
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('show');
  loadAll();
}

function doLogout() {
  sessionStorage.removeItem('ws_admin_ok');
  location.reload();
}

// ── Load ──
async function loadAll() {
  await Promise.all([loadUsers(), loadAnalytics()]);
}

async function loadUsers() {
  try {
    const { data, error } = await sb.from('profiles')
      .select('id,plan,word_count,is_beta,search_count,pro_until,last_seen_at,session_count,email')
      .order('created_at', { ascending: false });
    if (error) throw error;

    // get emails from auth via admin API
    allUsers = (data || []).map(r => ({
      ...r,
      plan: r.plan === 'pro' ? 'pro' : (r.plan === 'beta' || r.is_beta) ? 'beta' : 'free',
      email: r.email || (r.id ? r.id.slice(0,8)+'...' : '?')
    }));

    updateStats();
    renderUsers();
  } catch(e) {
    showToast('خطا: ' + e.message, 'err');
  }
}

async function loadAnalytics() {
  try {
    // Search logs
    const { data: logs } = await sb.from('search_logs')
      .select('query,lang,created_at,user_id')
      .order('created_at', { ascending: false })
      .limit(500);

    // Top words
    const wordCount = {};
    (logs || []).forEach(l => {
      if (l.query) wordCount[l.query] = (wordCount[l.query] || 0) + 1;
    });
    const topWords = Object.entries(wordCount)
      .sort((a,b) => b[1]-a[1])
      .slice(0, 10);

    // Daily searches
    const dailyMap = {};
    (logs || []).forEach(l => {
      const d = l.created_at ? l.created_at.slice(0,10) : '?';
      dailyMap[d] = (dailyMap[d] || 0) + 1;
    });
    const daily = Object.entries(dailyMap).sort((a,b) => b[0].localeCompare(a[0])).slice(0,7);

    renderAnalytics(topWords, daily, logs || []);
  } catch(e) {
    document.getElementById('analytics-container').innerHTML = '<div class="loading">آنالیتیک در دسترس نیست</div>';
  }
}

// ── Stats ──
function updateStats() {
  const pro = allUsers.filter(u => u.plan === 'pro').length;
  const beta = allUsers.filter(u => u.plan === 'beta').length;
  const free = allUsers.filter(u => u.plan === 'free').length;
  const total = allUsers.length;
  const mrr = pro * 4.99;
  const arr = mrr * 12;
  const conv = total > 0 ? ((pro/total)*100).toFixed(1) : 0;

  document.getElementById('st-total').textContent = total;
  document.getElementById('st-pro').textContent = pro;
  document.getElementById('st-beta').textContent = beta;
  document.getElementById('st-free').textContent = free;
  document.getElementById('st-mrr').textContent = 'MRR: €' + mrr.toFixed(2);
  document.getElementById('st-arr').textContent = '€' + arr.toFixed(0);
  document.getElementById('st-conv').textContent = conv + '%';
}

// ── Render Users ──
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
  el.classList.add('on');
  renderUsers();
}

function renderUsers() {
  const q = (document.getElementById('search-inp')?.value || '').toLowerCase();
  let users = allUsers;
  if (currentFilter !== 'all') users = users.filter(u => u.plan === currentFilter);
  if (q) users = users.filter(u => (u.email||'').toLowerCase().includes(q));

  if (!users.length) {
    document.getElementById('users-container').innerHTML = '<div class="loading">کاربری پیدا نشد</div>';
    return;
  }

  const now = new Date();
  let h = '<div class="table-wrap"><table><thead><tr>';
  h += '<th>ایمیل</th><th>پلن</th><th>Pro تا</th><th>لغت</th><th>سرچ امروز</th><th>آخرین فعالیت</th><th>عملیات</th>';
  h += '</tr></thead><tbody>';

  users.forEach(u => {
    const planBadge = u.plan === 'pro'
      ? '<span class="badge badge-pro">Pro</span>'
      : u.plan === 'beta'
      ? '<span class="badge badge-beta">Beta</span>'
      : '<span class="badge badge-free">Free</span>';

    let proUntil = '—';
    if (u.pro_until) {
      const d = new Date(u.pro_until);
      const diff = Math.ceil((d - now) / (1000*60*60*24));
      const dateStr = d.toLocaleDateString('fa-IR', {month:'short',day:'numeric'});
      proUntil = diff <= 0 ? `<span style="color:var(--err)">${dateStr} (منقضی)</span>`
        : diff <= 7 ? `<span style="color:var(--warn)">${dateStr} (${diff} روز)</span>`
        : dateStr;
    }

    const lastSeen = u.last_seen_at
      ? timeSince(new Date(u.last_seen_at))
      : '—';

    const email = u.email || u.id?.slice(0,8)+'...' || '?';

    h += `<tr>
      <td class="email-cell" title="${email}">${email}</td>
      <td>${planBadge}</td>
      <td style="font-size:12px">${proUntil}</td>
      <td>${u.word_count || 0}</td>
      <td>${u.search_count || 0}</td>
      <td style="font-size:12px;color:var(--ink3)">${lastSeen}</td>
      <td>
        <div style="display:flex;gap:5px">
          <button class="act-btn save" onclick="openExtend('${u.id}','${email.replace(/'/g,'`')}')">تمدید</button>
          ${u.plan !== 'free' ? `<button class="act-btn revoke" onclick="revokeUser('${u.id}')">لغو</button>` : ''}
        </div>
      </td>
    </tr>`;
  });

  h += '</tbody></table></div>';
  document.getElementById('users-container').innerHTML = h;
}

function timeSince(date) {
  const seconds = Math.floor((new Date() - date) / 1000);
  if (seconds < 60) return 'همین الان';
  if (seconds < 3600) return Math.floor(seconds/60) + ' دقیقه پیش';
  if (seconds < 86400) return Math.floor(seconds/3600) + ' ساعت پیش';
  if (seconds < 2592000) return Math.floor(seconds/86400) + ' روز پیش';
  return date.toLocaleDateString('fa-IR');
}

// ── Analytics ──
function renderAnalytics(topWords, daily, logs) {
  const max = topWords[0]?.[1] || 1;
  let h = '<div class="analytics-grid">';

  // Top words
  h += '<div class="a-card"><h3>🔍 پرتکرارترین سرچ‌ها</h3>';
  topWords.forEach(([word, count]) => {
    const pct = Math.round(count/max*100);
    h += `<div class="a-row">
      <span style="direction:ltr;font-family:serif;font-weight:600">${word}</span>
      <div class="a-bar-wrap"><div class="a-bar" style="width:${pct}%"></div></div>
      <span style="color:var(--ink3);font-size:11px">${count}</span>
    </div>`;
  });
  h += '</div>';

  // Daily searches
  const maxDay = daily[0]?.[1] || 1;
  h += '<div class="a-card"><h3>📅 سرچ روزانه</h3>';
  daily.forEach(([date, count]) => {
    const pct = Math.round(count/maxDay*100);
    h += `<div class="a-row">
      <span style="font-size:11px;color:var(--ink3)">${date}</span>
      <div class="a-bar-wrap"><div class="a-bar" style="width:${pct}%"></div></div>
      <span style="color:var(--ink3);font-size:11px">${count}</span>
    </div>`;
  });
  h += '</div>';

  // Total searches
  const totalSearches = logs.length;
  const uniqueUsers = new Set(logs.map(l => l.user_id)).size;
  h += `<div class="a-card"><h3>📈 خلاصه</h3>
    <div class="a-row"><span>کل سرچ‌ها</span><span style="font-weight:700">${totalSearches}</span></div>
    <div class="a-row"><span>کاربران فعال</span><span style="font-weight:700">${uniqueUsers}</span></div>
    <div class="a-row"><span>میانگین سرچ/کاربر</span><span style="font-weight:700">${uniqueUsers > 0 ? (totalSearches/uniqueUsers).toFixed(1) : 0}</span></div>
  </div>`;

  h += '</div>';
  document.getElementById('analytics-container').innerHTML = h;
}

// ── Actions ──
function openExtend(userId, email) {
  extendUserId = userId;
  document.getElementById('ext-email').value = email;
  document.getElementById('ext-days').value = '30';
  document.getElementById('extend-modal').classList.add('open');
}

function closeExtend() {
  document.getElementById('extend-modal').classList.remove('open');
}

async function doExtend() {
  const days = parseInt(document.getElementById('ext-days').value) || 30;
  if (!extendUserId || days < 1) return;

  try {
    const user = allUsers.find(u => u.id === extendUserId);
    const base = (user?.pro_until && new Date(user.pro_until) > new Date())
      ? new Date(user.pro_until)
      : new Date();
    base.setDate(base.getDate() + days);

    await sb.from('profiles').update({
      plan: 'pro',
      pro_until: base.toISOString(),
      is_beta: false
    }).eq('id', extendUserId);

    showToast(`✅ Pro تا ${base.toLocaleDateString('fa-IR')} تمدید شد`, 'ok');
    closeExtend();
    await loadUsers();
  } catch(e) {
    showToast('خطا: ' + e.message, 'err');
  }
}

async function revokeUser(userId) {
  if (!confirm('پلن این کاربر لغو بشه؟')) return;
  try {
    await sb.from('profiles').update({plan:'free', pro_until:null, is_beta:false}).eq('id', userId);
    showToast('✅ پلن لغو شد', 'ok');
    await loadUsers();
  } catch(e) {
    showToast('خطا: ' + e.message, 'err');
  }
}

// ── Tabs ──
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('tab-users').style.display = name === 'users' ? 'block' : 'none';
  document.getElementById('tab-analytics').style.display = name === 'analytics' ? 'block' : 'none';
}

// ── Export CSV ──
function exportCSV() {
  const rows = [['ایمیل','پلن','لغت','سرچ','آخرین فعالیت','Pro تا']];
  allUsers.forEach(u => {
    rows.push([u.email||u.id, u.plan, u.word_count||0, u.search_count||0, u.last_seen_at||'', u.pro_until||'']);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'wortschatz_users_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// ── Toast ──
let _toastT;
function showToast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.className = '', 3000);
}

// ── Init ──
if (sessionStorage.getItem('ws_admin_ok') === '1') {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('show');
  loadAll();
}
</script>
